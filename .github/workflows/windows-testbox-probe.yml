# Diagnostic-only revision on the PR-owned proof branch; not a product CI change.
name: Windows Testbox Probe

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Exact diagnostic commit SHA"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  probe:
    name: Windows watch phase diagnostic
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_TEST_SKIP_FULL_EXTENSIONS_SHARD: 1
      OPENCLAW_VITEST_MAX_WORKERS: 1
      OPENCLAW_TEST_PROJECTS_PARALLEL: 2
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false
          submodules: false

      - name: Verify source identity
        env:
          EXPECTED_HEAD: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          actual_head="$(git rev-parse HEAD)"
          [[ "$actual_head" == "$EXPECTED_HEAD" ]]
          printf 'diagnostic_source=%s\n' "$actual_head"
          git status --short

      - name: Try to exclude workspace from Windows Defender (best-effort)
        shell: pwsh
        run: |
          $cmd = Get-Command Add-MpPreference -ErrorAction SilentlyContinue
          if (-not $cmd) {
            Write-Host "Add-MpPreference not available, skipping Defender exclusions."
            exit 0
          }
          try {
            Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
            Add-MpPreference -ExclusionProcess "node.exe" -ErrorAction Stop
            Write-Host "Defender exclusions applied."
          } catch {
            Write-Warning "Failed to apply Defender exclusions, continuing. $($_.Exception.Message)"
          }

      - name: Setup exact Node.js
        env:
          REQUESTED_NODE_VERSION: "22.23.2"
        run: |
          set -euo pipefail
          source .github/actions/setup-pnpm-store-cache/ensure-node.sh
          openclaw_ensure_node "$REQUESTED_NODE_VERSION"

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          cache-mode: restore
          node-version: "22.23.2"

      - name: Capture node path and runtime versions
        run: |
          set -euo pipefail
          node_bin="$(dirname "$(node -p 'process.execPath')")"
          if command -v cygpath >/dev/null 2>&1; then
            node_bin="$(cygpath -u "$node_bin")"
          fi
          printf 'NODE_BIN=%s\n' "$node_bin" >> "$GITHUB_ENV"
          node -v
          npm -v
          pnpm -v
          node -e 'if (process.version !== "v22.23.2" || process.platform !== "win32") process.exit(1)'

      - name: Install dependencies
        run: |
          set -euo pipefail
          export PATH="$NODE_BIN:$PATH"
          pnpm install --frozen-lockfile --prefer-offline --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true || pnpm install --frozen-lockfile --prefer-offline --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true

      - name: Cold original Windows test-1 ordering and concurrency
        run: |
          set -euo pipefail
          export PATH="$NODE_BIN:$PATH"
          mkdir -p .artifacts/watch-timeout-windows
          pnpm test:windows:ci:1 2>&1 | tee .artifacts/watch-timeout-windows/original-order.log

      - name: Retain diagnostic logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-watch-phase-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/watch-timeout-windows/*.log
          if-no-files-found: warn
          retention-days: 7
